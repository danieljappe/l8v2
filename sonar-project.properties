# SonarCloud configuration for L8v2 monorepo
# Setup: https://sonarcloud.io → My Projects → Import repository → L8v2
# After import, SonarCloud will show the correct projectKey and organization below.

sonar.projectKey=danieljappe_l8v2
sonar.organization=danieljappesonarcloud

# ---------- Sources ----------
sonar.sources=L8V2_FE/src,L8v2_BE/src

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/scripts/**,\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/coverage/**,\
  **/migrations/**

# ---------- Tests ----------
sonar.tests=L8v2_BE/src/__tests__
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# ---------- Coverage ----------
# Generated by: npm run test:coverage in L8v2_BE (jest --coverage --coverageReporters=lcov)
# The CI test job uploads coverage/lcov.info as artifact; the sonar job downloads it.
sonar.javascript.lcov.reportPaths=L8v2_BE/coverage/lcov.info

# ---------- Quality Gate ----------
# SonarCloud default Quality Gate blocks PRs on new code issues.
# Override thresholds in: sonarcloud.io → Project → Administration → Quality Gates

sonar.sourceEncoding=UTF-8
