# .github/workflows/ci.yml
#
# CI/CD pipeline for L8v2 monorepo.
# Repo layout:
#   L8v2_BE/   – Node 18 / Express / TypeScript / TypeORM / PostgreSQL
#   L8V2_FE/   – React 18 / Vite 5 / TypeScript / Tailwind
#
# Job graph:
#   lint ──┐
#           ├──> sonar (SonarCloud analysis, with coverage artifact)
#           ├──> build ──> deploy (pm2 on VPS, main only, manual approval)
#   test ──┘

name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

# Cancel in-progress runs for the same branch/PR to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # =========================================================================
  # JOB 1: lint
  # Runs ESLint on both frontend and backend.
  # =========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            L8V2_FE/package-lock.json
            L8v2_BE/package-lock.json

      - name: Install frontend dependencies
        working-directory: L8V2_FE
        run: npm ci

      - name: Run ESLint (Frontend)
        working-directory: L8V2_FE
        run: npm run lint

      - name: Install backend dependencies
        working-directory: L8v2_BE
        run: npm ci

      - name: Run ESLint (Backend)
        working-directory: L8v2_BE
        run: npm run lint

  # =========================================================================
  # JOB 2: test
  # Runs backend unit + integration tests with coverage against a live
  # PostgreSQL instance, then uploads the lcov report as an artifact for
  # the SonarCloud job to consume.
  #
  # Notes:
  #   - setup.ts calls AppDataSource.synchronize(true) — schema is
  #     self-managed, no migration:run step needed before tests.
  #   - Local .env.test uses DB_PORT=5433 (Docker offset); CI service
  #     container runs on 5432. Job-level env vars override cleanly since
  #     dotenv does nothing when .env.test is absent in CI.
  # =========================================================================
  test:
    name: Test (Backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: l8v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: l8v2_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: L8v2_BE/package-lock.json

      - name: Install backend dependencies
        working-directory: L8v2_BE
        run: npm ci

      - name: Run tests with coverage
        working-directory: L8v2_BE
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: L8v2_BE/coverage/lcov.info
          retention-days: 7

  # =========================================================================
  # JOB 3: sonar
  # Runs SonarCloud static analysis after lint + test pass.
  # Downloads the coverage artifact produced by the test job so that
  # SonarCloud can track coverage metrics over time.
  #
  # Requires:
  #   SONAR_TOKEN — repo secret (Settings → Secrets → Actions)
  #   sonar-project.properties — at the repo root (already committed)
  # To get a token: sonarcloud.io → My Account → Security → Generate Token
  # =========================================================================
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for blame data and new-code detection

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: L8v2_BE/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # =========================================================================
  # JOB 4: build
  # Runs after both lint and test pass.
  # Compiles backend (tsc) and builds both frontend platforms (Vite).
  # =========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            L8v2_BE/package-lock.json
            L8V2_FE/package-lock.json

      - name: Install backend dependencies
        working-directory: L8v2_BE
        run: npm ci

      - name: Build backend
        working-directory: L8v2_BE
        run: npm run build

      - name: Install frontend dependencies
        working-directory: L8V2_FE
        run: npm ci

      - name: Build frontend – events
        working-directory: L8V2_FE
        env:
          VITE_PLATFORM: events
        run: npm run build:events

      - name: Build frontend – booking
        working-directory: L8V2_FE
        env:
          VITE_PLATFORM: booking
        run: npm run build:booking

  # =========================================================================
  # JOB 5: deploy
  # Fires only on push to main. Requires manual approval via the
  # "production" GitHub Environment (Settings → Environments → production).
  #
  # Required secrets (add to the production environment):
  #   VPS_HOST     – IP or hostname of your VPS
  #   VPS_USER     – SSH username (e.g. danieljappe)
  #   VPS_SSH_KEY  – private SSH key with access to the VPS
  # =========================================================================
  deploy:
    name: Deploy (pm2 on VPS)
    runs-on: ubuntu-latest
    needs: [build]
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e

            # Pull latest — discard any local changes on VPS
            cd /var/www/l8v2
            git fetch origin
            git reset --hard origin/main

            # Fix dist ownership so Vite can clean and rebuild
            sudo chown -R danieljappe:danieljappe /var/www/l8v2/L8V2_FE/dist || true

            # Backend (keep devDependencies for tsc)
            cd /var/www/l8v2/L8v2_BE
            npm ci
            npm run build
            npm run migration:run

            # Frontend
            cd /var/www/l8v2/L8V2_FE
            npm ci
            npm run build:events

            # Only restart pm2 if all builds succeeded
            pm2 restart /var/www/ecosystem.config.js --update-env
